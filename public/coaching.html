<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E1C26">
<title>Principles of Play — Roles, not positions</title>
<style>
:root{
  --ink:#0E1C26; --board:#152C39;
  --chalk:#EEF4F1; --dim:#8CA5B0;
  --attack:#FFC61E; --defend:#5AB0E8;
  --ok:#74D6A4; --miss:#F2795C; --talk:#B9A6FF;
  --rule:rgba(238,244,241,.14);
  --disp:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--ink);color:var(--chalk);font-family:var(--disp);
  font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased;overscroll-behavior:none}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
:focus-visible{outline:3px solid var(--attack);outline-offset:3px;border-radius:4px}

.app{display:flex;flex-direction:column;height:100dvh;max-width:1280px;margin:0 auto}

/* ---------- header ---------- */
.bar{display:flex;align-items:center;gap:14px;padding:9px 14px;border-bottom:1px solid var(--rule);flex:0 0 auto}
.brand{font-weight:800;letter-spacing:.14em;text-transform:uppercase;font-size:11px;color:var(--dim);white-space:nowrap}
.brand b{color:var(--chalk)}
.rail{display:flex;gap:6px;align-items:center;margin-left:auto;margin-right:auto;flex-wrap:wrap;justify-content:center}
.pip{width:15px;height:15px;border-radius:50%;border:2px solid var(--rule);padding:0;flex:0 0 auto}
.pip[data-kind="talk"]{border-style:dashed;border-color:rgba(185,166,255,.5)}
.pip[data-state="done"]{background:var(--rule);border-color:transparent}
.pip[data-state="done"][data-kind="talk"]{background:rgba(185,166,255,.28);border-color:transparent}
.pip[data-state="now"]{background:var(--chalk);border-color:var(--chalk);transform:scale(1.2)}
.pip[data-state="now"][data-kind="talk"]{background:var(--talk);border-color:var(--talk)}
.railgap{width:1px;height:15px;background:var(--rule);margin:0 4px;flex:0 0 auto}
.tally{font-family:var(--mono);font-size:12px;color:var(--dim);white-space:nowrap}
.tally b{color:var(--ok);font-size:15px}
.streak{display:flex;align-items:center;gap:4px;font-family:var(--mono);font-weight:800;color:var(--attack)}
.streak .flame{font-size:14px}
#streakN{font-size:15px}
.streak.grow2 #streakN{font-size:19px}
.streak.grow3 #streakN{font-size:23px}
@keyframes streakpop{0%{transform:scale(1)}45%{transform:scale(1.55)}100%{transform:scale(1)}}
.streak.pop{animation:streakpop .35s ease}
.sndbtn{width:34px;height:34px;border-radius:50%;border:1px solid var(--rule);font-size:15px;
  display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.sndbtn:hover{background:rgba(255,255,255,.07)}
.sndbtn[aria-pressed="true"]{border-color:var(--attack);background:rgba(255,198,30,.12)}
.scensel{font-size:11px;font-weight:700;letter-spacing:.02em;border-radius:999px;
  padding:7px 12px;background:transparent;color:var(--chalk);border:1px solid var(--rule);
  max-width:238px;-webkit-appearance:none;appearance:none;cursor:pointer}
.scensel:hover{background:rgba(255,255,255,.06)}
.scensel option{background:#152C39;color:#EEF4F1}
.modebtn{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
  border-radius:999px;padding:7px 13px;white-space:nowrap;color:var(--ink);background:var(--chalk)}

/* ---------- stage ---------- */
.stage{flex:1 1 auto;display:flex;min-height:0}
.fieldwrap{position:relative;flex:1 1 auto;min-width:0;min-height:0;display:flex;flex-direction:column;justify-content:center;padding:8px 10px 6px}
.field{position:relative;width:100%;aspect-ratio:1000/640;max-height:calc(100% - 58px);flex:0 1 auto}
.field svg{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:manipulation}

.disc{cursor:pointer}
.disc circle.halo{opacity:0;transition:opacity .16s}
.disc:hover circle.halo{opacity:.4}
.unit{transition:transform .8s cubic-bezier(.3,.7,.25,1)}
.ball{transition:transform .85s cubic-bezier(.35,.05,.2,1)}
@keyframes drop{from{opacity:0;transform:scale(.35)}to{opacity:1;transform:scale(1)}}
.disc.enter{animation:drop .44s cubic-bezier(.2,.9,.3,1) backwards;
  transform-box:fill-box;transform-origin:center}

/* ---------- question panel, on the field ---------- */
.panel{
  position:absolute;top:2.2%;left:1.8%;
  width:min(50%,410px);max-height:42%;
  display:flex;flex-direction:column;
  background:rgba(9,22,30,.9);border-left:3px solid var(--attack);
  border-radius:3px 9px 9px 3px;padding:9px 12px 11px;
  -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);
}
.panel[data-kind="talk"]{border-left-style:dashed;border-left-color:var(--talk)}
.panel[data-kind="info"]{border-left-color:var(--dim)}
.panel.tall{max-height:64%}
.pbody{overflow-y:auto;min-height:0}
.pnav{flex:0 0 auto;display:flex;gap:7px;align-items:center;
  margin-top:9px;padding-top:9px;border-top:1px solid var(--rule)}
.pnav .btn{padding:8px 14px;font-size:clamp(11px,1.05vw,13.5px)}
.pnav #nextBtn{margin-left:auto}

.collapse{position:absolute;top:6px;right:7px;width:26px;height:26px;border-radius:7px;
  color:var(--dim);font-size:12px;line-height:1;display:flex;align-items:center;justify-content:center}
.collapse:hover{background:rgba(255,255,255,.08);color:var(--chalk)}
.pill{display:none}

/* --- collapsed: one slim row, controls still with the question --- */
.panel.min{flex-direction:row;align-items:center;gap:5px;
  width:auto;max-width:min(66%,430px);max-height:none;padding:5px 5px 5px 9px;
  border-radius:3px 999px 999px 3px}
.panel.min .pbody{display:none}
.panel.min .pnav{display:contents}
.panel.min .pill{display:block;order:2;flex:1 1 auto;font-size:clamp(11px,1.15vw,14px);font-weight:700;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;padding:0 2px}
.panel.min .collapse{position:static;order:5;flex:0 0 auto}
.panel.min #backBtn{order:1}
.panel.min #actBtn{order:3}
.panel.min #nextBtn{order:4;margin-left:0}
.panel.min .btn{padding:6px 11px;font-size:14px;line-height:1}

.kicker{font-family:var(--mono);font-size:9.5px;letter-spacing:.15em;text-transform:uppercase;color:var(--dim);margin:0 0 4px;padding-right:26px}
.kicker em{font-style:normal;color:var(--talk)}
.q{margin:0;font-size:clamp(14px,1.85vw,21px);font-weight:800;letter-spacing:-.015em;line-height:1.2;padding-right:22px}
.body{margin:7px 0 0;font-size:clamp(11px,1.05vw,14px);color:#C3D3DA;line-height:1.5}
.body b{color:var(--chalk)}
.resp{border-left:2px solid var(--rule);padding-left:9px;margin-top:9px}
.pairs{margin:8px 0 0;font-family:var(--mono);font-size:clamp(10px,1vw,13px);line-height:1.85;color:#C3D3DA}
.pairs i{font-style:normal;color:var(--attack)}
.pairs u{text-decoration:none;color:var(--defend)}
.choices{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}
.choice{border:1px dashed var(--talk);border-radius:8px;padding:8px 13px;
  font-size:clamp(11px,1.05vw,14px);font-weight:700}
.choice:hover{background:rgba(185,166,255,.12)}
.choice[aria-pressed="true"]{background:rgba(185,166,255,.2);border-style:solid}
.choice[data-tone="good"][aria-pressed="true"]{border-style:solid;border-color:var(--ok);background:rgba(116,214,164,.2)}
.choice[data-tone="fair"][aria-pressed="true"]{border-style:solid;border-color:var(--attack);background:rgba(255,198,30,.16)}
.choice[data-tone="poor"][aria-pressed="true"]{border-style:solid;border-color:var(--miss);background:rgba(242,121,92,.18)}
.resp[data-tone="good"]{border-left-color:var(--ok)}
.resp[data-tone="good"] b{color:var(--ok)}
.resp[data-tone="fair"]{border-left-color:var(--attack)}
.resp[data-tone="fair"] b{color:var(--attack)}
.resp[data-tone="poor"]{border-left-color:var(--miss)}
.resp[data-tone="poor"] b{color:var(--miss)}
.qr{width:74px;height:74px;margin-top:10px;border:2px dashed var(--rule);border-radius:9px;
  display:flex;align-items:center;justify-content:center;text-align:center;
  font-family:var(--mono);font-size:8.5px;line-height:1.3;color:var(--dim);padding:6px}

/* ---------- callout anchored to a player ---------- */
.pop{
  position:absolute;left:0;top:0;z-index:5;
  width:clamp(150px,30%,290px);max-height:36%;overflow-y:auto;
  background:rgba(9,22,30,.97);border:1.5px solid var(--rule);border-radius:10px;
  padding:9px 11px 10px;pointer-events:none;
  box-shadow:0 10px 30px rgba(0,0,0,.5);
  opacity:0;transition:opacity .16s ease, scale .16s ease;scale:.92;
}
.pop.show{opacity:1;scale:1}
.pop[hidden]{display:none}
.pop h4{margin:0;padding-right:20px;font-size:clamp(11px,1.15vw,15px);font-weight:800;letter-spacing:-.01em;line-height:1.25}
.pop p{margin:4px 0 0;font-size:clamp(10px,.95vw,13px);line-height:1.45;color:#C3D3DA}
.pop[data-tone="ok"]{border-color:var(--ok)}
.pop[data-tone="ok"] h4{color:var(--ok)}
.pop[data-tone="miss"]{border-color:rgba(242,121,92,.75)}
.pop[data-tone="miss"] h4{color:var(--miss)}
.pop[data-tone="talk"]{border-color:rgba(185,166,255,.7)}
.pop[data-tone="talk"] h4{color:var(--talk)}
.popx{position:absolute;top:3px;right:4px;width:22px;height:22px;border-radius:6px;
  pointer-events:auto;color:var(--dim);font-size:15px;line-height:1;
  display:flex;align-items:center;justify-content:center}
.popx:hover{background:rgba(255,255,255,.1);color:var(--chalk)}
.pop .nib{position:absolute;width:10px;height:10px;background:inherit;
  border:inherit;border-top:none;border-right:none}
.pop[data-nib="l"] .nib{transform:rotate(45deg)}
.pop[data-nib="r"] .nib{transform:rotate(225deg)}
.pop[data-nib="t"] .nib{transform:rotate(135deg)}
.pop[data-nib="b"] .nib{transform:rotate(-45deg)}
.pop[data-nib="x"] .nib{display:none}

.tip{position:absolute;z-index:8;width:min(320px,74%);background:rgba(9,22,30,.98);
  border:1.5px solid var(--rule);border-radius:9px;padding:8px 11px 10px;pointer-events:none;
  box-shadow:0 8px 26px rgba(0,0,0,.55);opacity:0;transition:opacity .13s}
.tip.show{opacity:1}
.tip[hidden]{display:none}
.tip b{display:block;font-size:13px;font-weight:800;margin-bottom:3px;letter-spacing:-.01em}
.tip span{display:block;font-size:12px;line-height:1.45;color:#C3D3DA}
.tip[data-side="a"]{border-color:rgba(255,198,30,.6)}
.tip[data-side="a"] b{color:var(--attack)}
.tip[data-side="d"]{border-color:rgba(90,176,232,.6)}
.tip[data-side="d"] b{color:var(--defend)}
.li{cursor:help}

/* ---------- the ten, always on screen ---------- */
.legend{flex:0 0 auto;display:grid;grid-template-columns:auto repeat(5,1fr);
  gap:2px 6px;align-items:center;padding:7px 2px 2px}
.lcap{font-family:var(--mono);font-size:clamp(7.5px,.8vw,9.5px);letter-spacing:.14em;
  text-transform:uppercase;color:var(--dim);padding-right:6px;white-space:nowrap}
.li{font-size:clamp(8.5px,1.02vw,12.5px);font-weight:700;letter-spacing:-.01em;
  text-align:center;padding:3px 2px;border-radius:5px;border:1px solid transparent;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:all .25s}
.li[data-side="a"]{color:rgba(255,198,30,.34)}
.li[data-side="d"]{color:rgba(90,176,232,.34)}
.li[data-state="done"][data-side="a"]{color:rgba(255,198,30,.8)}
.li[data-state="done"][data-side="d"]{color:rgba(90,176,232,.8)}
.li[data-state="live"][data-side="a"]{color:#0E1C26;background:var(--attack);border-color:var(--attack)}
.li[data-state="live"][data-side="d"]{color:#0E1C26;background:var(--defend);border-color:var(--defend)}
.li[data-state="off"]{opacity:.42;border-style:dashed;border-color:var(--rule)}

@media (prefers-reduced-motion:reduce){
  .unit,.ball,.pop{transition:none!important}
  .disc.enter{animation:none!important}
}

/* ---------- notes ---------- */
.notes{flex:0 0 296px;position:relative;border-left:1px solid var(--rule);background:var(--board);
  padding:16px 16px 22px;overflow-y:auto;transition:flex-basis .2s}
.notes[hidden]{display:none}
.ntoggle{position:absolute;top:7px;right:9px;width:26px;height:26px;border-radius:7px;z-index:2;
  color:var(--dim);font-size:14px;line-height:1;display:flex;align-items:center;justify-content:center}
.ntoggle:hover{background:rgba(255,255,255,.09);color:var(--chalk)}
.nlabel{display:none}
.notes.min{flex:0 0 38px;padding:42px 7px 12px;overflow:hidden}
.notes.min .ninner{display:none}
.notes.min .nlabel{display:block;writing-mode:vertical-rl;font-family:var(--mono);
  font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim);white-space:nowrap}
.foryou{margin-bottom:20px}
.fybody{font-size:14.5px;line-height:1.55;color:#C7D6DC}
.fybody b{color:var(--chalk)}
.foryou .qr{width:104px;height:104px;margin-top:12px;background:#fff;
  border:none;border-radius:8px;padding:6px;display:block}
.foryou .qr img{width:100%;height:100%;object-fit:contain;display:block;border-radius:2px}
.notes h3{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim);margin:0 0 10px;font-weight:800}
.clock{font-family:var(--mono);font-size:24px;margin:0 0 2px;padding-right:30px}
.foryou h3{padding-right:30px}
.clockcap{font-family:var(--mono);font-size:10px;color:var(--dim);text-transform:uppercase;letter-spacing:.11em;margin:0 0 18px;line-height:1.6}
.notes ul{margin:0;padding:0;list-style:none}
.notes li{font-size:13.5px;line-height:1.55;color:#C7D6DC;padding:0 0 2px 14px;border-left:2px solid var(--rule);margin-bottom:13px}
.notes li:last-child{margin-bottom:0}
.notes li b{color:var(--chalk);font-weight:700}
.saybox{border:1px solid var(--rule);border-radius:10px;padding:12px 13px;margin-bottom:18px;background:rgba(255,255,255,.03)}
.saybox p{margin:0;font-size:14.5px;line-height:1.5}
.saybox span{display:block;font-family:var(--mono);font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim);margin-bottom:6px}

/* ---------- nav ---------- */
.btn{border:1px solid var(--rule);border-radius:9px;padding:10px 17px;font-size:14px;font-weight:700;white-space:nowrap}
.btn:hover{background:rgba(255,255,255,.06)}
.btn.go{background:var(--chalk);color:var(--ink);border-color:var(--chalk)}
.btn.go:hover{background:#fff}
.btn.ghost{color:var(--dim)}
.btn[disabled]{opacity:.32;cursor:default}
.btn[disabled]:hover{background:none}

@media (max-width:560px){
  .pop{position:static!important;width:auto;max-width:none;max-height:32vh;
       margin:6px 0 0;scale:1!important;order:2}
  .pop .nib{display:none!important}
  .legend{order:3}
}
@media (max-width:900px){
  .stage{flex-direction:column}
  .notes{flex:0 0 auto;border-left:none;border-top:1px solid var(--rule);max-height:36vh}
  .notes.min{flex:0 0 auto;padding:9px 12px;max-height:none}
  .notes.min .nlabel{writing-mode:horizontal-tb;font-size:9.5px}
  .fieldwrap{padding:5px}
  .brand span{display:none}
  .scensel{max-width:150px;padding:6px 9px}
  .panel{width:min(60%,340px);max-height:46%;padding:7px 9px 9px}
  .legend{gap:2px 4px;padding-top:5px}
  .panel.min{max-width:78%}
  .pop{width:min(38%,230px)}
  .pnav{margin-top:7px;padding-top:7px}
  .pnav .btn{padding:7px 11px}
}
</style>
</head>
<body>
<div class="app">

  <header class="bar">
    <div class="brand"><b>Roles, not positions</b><span> · Principles of Play</span></div>
    <nav class="rail" id="rail" aria-label="Steps"></nav>
    <div class="tally" id="tally" title="Questions answered right first time"></div>
    <div class="streak" id="streak" hidden><span id="streakN"></span><span class="flame">🔥</span></div>
    <button class="sndbtn" id="sndBtn" aria-pressed="false" aria-label="Sound is off" title="Sound is off">🔇</button>
    <select class="scensel" id="scenSel" aria-label="Choose what to run"></select>
  </header>

  <div class="stage">
    <div class="fieldwrap" id="fieldwrap">
      <div class="field" id="field">
        <svg id="pitch" viewBox="0 0 1000 640" role="img"
             aria-label="Soccer field diagram, attacking toward the goal on the right"></svg>
        <section class="panel" id="panel">
          <button class="collapse" id="collapseBtn" aria-expanded="true"
                  aria-label="Hide the instructions" title="Hide the instructions">▴</button>
          <span class="pill" id="pill"></span>
          <div class="pbody" id="pbody" aria-live="polite">
            <p class="kicker" id="kicker"></p>
            <h1 class="q" id="q"></h1>
            <p class="body" id="body"></p>
            <div class="pairs" id="pairs" hidden></div>
            <div class="choices" id="choices"></div>
            <p class="body resp" id="resp" hidden></p>
          </div>
          <div class="pnav" id="pnav">
            <button class="btn ghost" id="backBtn">Back</button>
            <button class="btn go" id="actBtn" hidden></button>
            <button class="btn go" id="nextBtn">Next</button>
          </div>
        </section>
      </div>
      <div class="pop" id="pop" role="status" hidden>
        <span class="nib"></span>
        <button class="popx" id="popX" aria-label="Close this note">×</button>
        <h4 id="popH"></h4>
        <p id="popB"></p>
      </div>
      <div class="legend" id="legend"></div>
      <div class="tip" id="tip" hidden><b id="tipH"></b><span id="tipB"></span></div>
    </div>

    <aside class="notes" id="notes" aria-label="Coach notes">
      <button class="ntoggle" id="notesToggle" aria-expanded="true"
              aria-label="Hide coach notes" title="Hide coach notes">›</button>
      <span class="nlabel">Coach notes</span>
      <div class="ninner" id="ninner">
      <div class="foryou" id="foryou" hidden>

var sndOn = false, AC = null;
function ac(){
  if (!AC){
    var C = window.AudioContext || window.webkitAudioContext;
    if (!C) return null;
    AC = new C();
  }
  if (AC.state === "suspended") AC.resume();
  return AC;
}
function tone(f0, f1, t0, dur, type, vol){
  var c = ac(); if (!c) return;
  var o = c.createOscillator(), g = c.createGain();
  o.type = type || "sine";
  var t = c.currentTime + (t0 || 0);
  o.frequency.setValueAtTime(f0, t);
  if (f1) o.frequency.exponentialRampToValueAtTime(f1, t + dur);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(vol || 0.18, t + 0.015);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(c.destination);
  o.start(t); o.stop(t + dur + 0.05);
}

  cast:["A1","D1"], ball:"A1", at:{D1:"D1_show"}, tags:{A1:"1st ATT", D1:"1st DEF"},
  q:"Creativity against control, with nothing else on the field.",
  a:"The attacker is allowed to gamble because the downside is small. The defender is not allowed to gamble because the downside is a goal. Same moment, opposite permissions.",
  say:"That last line is the whole pair, and it's the one they'll remember.",
  why:["Transfer to the field: a one-against-one ladder where nobody keeps score. The moment you score it, the attackers stop trying things and the defenders start diving in."],
  next:"Start over"
}
];

var SCEN = [
  {id:"session", name:"Full session \u2014 all ten", field:"third", tracks:true,
   P:SESS_P,  SPOT:SESS_SPOT,  STEPS:SESS_STEPS},
  {id:"wide",   name:"The wide ball", field:"third",
   P:WIDE_P,  SPOT:WIDE_SPOT,  STEPS:WIDE_STEPS},
  {id:"turn",   name:"The turnover", field:"full",
   P:TURN_P,  SPOT:TURN_SPOT,  STEPS:TURN_STEPS},
  {id:"ctr",    name:"Counter, 3 v 2", field:"third",
   P:CTR_P,   SPOT:CTR_SPOT,   STEPS:CTR_STEPS},
  {id:"build",  name:"Building out", field:"full",
   P:BUILD_P, SPOT:BUILD_SPOT, STEPS:BUILD_STEPS},
  {id:"over",   name:"Overload, 3 v 1", field:"third",
   P:OVER_P,  SPOT:OVER_SPOT,  STEPS:OVER_STEPS},
  {id:"third",  name:"Third-man run", field:"third",
   P:THIRD_P, SPOT:THIRD_SPOT, STEPS:THIRD_STEPS},
  {id:"switch", name:"The switch", field:"third",
   P:SW_P,    SPOT:SW_SPOT,    STEPS:SW_STEPS},
  {id:"cross",  name:"Defending the cross", field:"third",
   P:CR_P,    SPOT:CR_SPOT,    STEPS:CR_STEPS},
  {id:"lap",    name:"The overlap", field:"third",
   P:OV_P,    SPOT:OV_SPOT,    STEPS:OV_STEPS},
  {id:"iso",    name:"One against one", field:"third",
   P:ISO_P,   SPOT:ISO_SPOT,   STEPS:ISO_STEPS}
];

var scenIdx = 0;
var P = SESS_P, SPOT = SESS_SPOT, STEPS = SESS_STEPS, ORIG = null;
function scen(){ return SCEN[scenIdx]; }

function clone(o){ return JSON.parse(JSON.stringify(o)); }

function loadScenario(n){
  scenIdx = Math.max(0, Math.min(SCEN.length - 1, n));
  var sc = SCEN[scenIdx];
  P = sc.P; SPOT = sc.SPOT; STEPS = clone(sc.STEPS); ORIG = clone(sc.STEPS);
  if (!sc.tracks) trackIdx = 0;
  document.getElementById("scenSel").value = scenIdx + "|" + trackIdx;
  right = 0; streak = 0; cheered = false; qscore = {};
   hidePop(); hideTip();
  drawField(sc.field);
  buildSeq(); goSeq(0);
}
function split1(s){
  var k = s.indexOf("|");
  return k < 0 ? {h:"", b:s} : {h:s.slice(0,k).trim(), b:s.slice(k+1).trim()};
}

/* ============================================================
   STATE
   ============================================================ */
var TRACKS = [{key:"F",name:"Full session"},{key:"S",name:"Short session"}];
var trackIdx = 0, seq = [], pos_ = 0, cur = null;
var askIdx = 0, resolved = false, acted = false, collapsed = false;
var tried = {}, hitId = null, entering = [];
var markGood = [], markPoor = [], chosen = -1, base = null, zonePicked = null;
var qscore = {};   // per-question verdict for this run: 'right' | 'wrong'
var right = 0, notesOpen = true;
var streak = 0, bestStreak = 0, cheered = false;

function track(){ return TRACKS[trackIdx].key; }
function buildSeq(){
  seq = [];
  var ht = SCEN[scenIdx].tracks;
  STEPS.forEach(function(s,n){
    if (ht && s.track.indexOf(track()) < 0) return;
    if (s.coachOnly && !notesOpen) return;   // closed notes = the version for players
    seq.push(n);
  });
}
function trackTotal(){ var t = 0; seq.forEach(function(n){ t += STEPS[n].time; }); return t; }
function mmss(s){ return Math.floor(s/60) + ":" + ("0" + (s%60)).slice(-2); }

/* ============================================================
   FIELD
   ============================================================ */
var NS = "http://www.w3.org/2000/svg";
var pitch = document.getElementById("pitch");
var pop = document.getElementById("pop");

function el(tag, attrs, parent){
  var n = document.createElementNS(NS, tag);
  for (var k in attrs) n.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(n);
  return n;
}

function drawField(mode){
  pitch.innerHTML = "";
  var defs = el("defs", {}, pitch);
  var g = el("linearGradient", {id:"turf", x1:"0", y1:"0", x2:"1", y2:"1"}, defs);
  el("stop", {offset:"0", "stop-color":"#1C5D45"}, g);
  el("stop", {offset:"1", "stop-color":"#154B36"}, g);
  el("rect", {x:0, y:0, width:1000, height:640, fill:"url(#turf)"}, pitch);
  for (var s2=1; s2<6; s2+=2) el("rect", {x:s2*167, y:0, width:167, height:640, fill:"#FFF", opacity:".025"}, pitch);

  function line(d, w, o){
    el("path", {d:d, fill:"none", stroke:"rgba(240,255,248," + (o||".32") + ")", "stroke-width":(w||3)}, pitch);
  }
  var full = (mode === "full");
  var left = full ? 38 : 20;

  line("M " + left + " 34 L 962 34");
  line("M " + left + " 606 L 962 606");
  line("M 962 34 L 962 606");

  // attacking goal, always on the right
  line("M 962 128 L 790 128 L 790 512 L 962 512");
  line("M 962 236 L 900 236 L 900 404 L 962 404");
  line("M 790 258 A 92 92 0 0 0 790 382");
  line("M 962 268 L 986 268 M 962 372 L 986 372 M 986 268 L 986 372", 5, ".6");
  el("circle", {cx:872, cy:320, r:4, fill:"rgba(240,255,248,.4)"}, pitch);

  if (full){
    line("M 38 34 L 38 606");
    line("M 500 34 L 500 606");
    line("M 500 230 A 90 90 0 0 0 500 410");
    line("M 500 230 A 90 90 0 0 1 500 410");
    line("M 38 128 L 210 128 L 210 512 L 38 512");
    line("M 38 236 L 100 236 L 100 404 L 38 404");
    line("M 210 258 A 92 92 0 0 1 210 382");
    line("M 38 268 L 14 268 M 38 372 L 14 372 M 14 268 L 14 372", 5, ".6");
    el("circle", {cx:128, cy:320, r:4, fill:"rgba(240,255,248,.4)"}, pitch);
  }

  var kx = full ? 60 : 34;
  el("circle", {cx:kx, cy:584, r:7, fill:"#FFC61E", opacity:".75"}, pitch);
  var t1 = el("text", {x:kx+15, y:590, fill:"rgba(240,255,248,.45)", "font-size":"15",
    "font-family":"ui-monospace,monospace", "letter-spacing":"2"}, pitch);
  t1.textContent = "ATTACK \u2192";
  el("circle", {cx:kx+156, cy:584, r:7, fill:"#5AB0E8", opacity:".75"}, pitch);
  var t2 = el("text", {x:kx+171, y:590, fill:"rgba(240,255,248,.45)", "font-size":"15",
    "font-family":"ui-monospace,monospace", "letter-spacing":"2"}, pitch);
  t2.textContent = "DEFEND";

  el("g", {id:"zones"}, pitch);
  el("g", {id:"units"}, pitch);
  el("g", {id:"ballL"}, pitch);
}

function at(id){
  if (cur.at && cur.at[id] && SPOT[cur.at[id]]) return SPOT[cur.at[id]];
  return {x:P[id].x, y:P[id].y};
}

function drawUnits(){
  var units = document.getElementById("units");
  var cast = cur.cast || [];
  var tags = cur.tags || {};

  // drop anyone no longer on the field
  [].slice.call(units.children).forEach(function(n){
    if (cast.indexOf(n.getAttribute("data-id")) < 0) units.removeChild(n);
  });

  cast.forEach(function(id, idx){
    var p = at(id);
    var isA = P[id].t === "a";
    var col = isA ? "#FFC61E" : "#5AB0E8";
    var isHit = (hitId === id), isGood = markGood.indexOf(id) > -1;
    var isTried = !!tried[id] || markPoor.indexOf(id) > -1;

    // reuse the existing node so a transform change transitions instead of teleporting
    var u = units.querySelector('[data-id="' + id + '"]');
    var fresh = !u;
    if (fresh) u = el("g", {"class":"unit", "data-id":id}, units);
    else while (u.firstChild) u.removeChild(u.firstChild);
    u.setAttribute("transform", "translate(" + p.x + "," + p.y + ")");

    var b = el("g", {"class":"disc", tabindex:"0", role:"button"}, u);
    b.setAttribute("aria-label", (isA ? "Attacker " : "Defender ") + P[id].n);
    if (fresh && entering.indexOf(id) > -1){
      b.setAttribute("class", "disc enter");
      b.style.animationDelay = (entering.indexOf(id) * 95) + "ms";
    }

    el("circle", {"class":"halo", r:44, fill:col}, b);
    el("circle", {r:36, fill:"transparent"}, b);
    if (isHit || isGood) el("circle", {r:35, fill:"none", stroke:"#74D6A4", "stroke-width":5}, b);
    else if (isTried)    el("circle", {r:35, fill:"none", stroke:"#F2795C", "stroke-width":5}, b);
    el("circle", {r:25, fill:col, stroke:"rgba(10,25,32,.5)", "stroke-width":2,
      opacity:(isTried && !isHit && !isGood) ? ".6" : "1"}, b);

    var num = el("text", {"text-anchor":"middle", y:8, fill:"#0E1C26", "font-size":"24",
      "font-weight":"800", "font-family":"ui-sans-serif,system-ui,sans-serif", "pointer-events":"none"}, b);
    num.textContent = P[id].n;

    if (isHit){
      var ck = el("g", {transform:"translate(20,-20)", "pointer-events":"none"}, b);
      el("circle", {r:12, fill:"#74D6A4"}, ck);
      el("path", {d:"M -5 0 L -1.5 4 L 5.5 -4", fill:"none", stroke:"#0E1C26",
        "stroke-width":3, "stroke-linecap":"round", "stroke-linejoin":"round"}, ck);
    }

    b.addEventListener("click", function(){ onTap(id); });
    b.addEventListener("keydown", function(e){
      if (e.key === "Enter" || e.key === " "){ e.preventDefault(); onTap(id); }
    });

    if (tags[id]){
      var label = tags[id], w = label.length * 8.2 + 16;
      var tg = el("g", {"pointer-events":"none"}, u);
      el("rect", {x:-w/2, y:-58, width:w, height:24, rx:5, fill:"#0E1C26",
        stroke:col, "stroke-width":1.5, opacity:".95"}, tg);
      var tx = el("text", {"text-anchor":"middle", y:-41, fill:col, "font-size":"13",
        "font-weight":"800", "letter-spacing":"1",
        "font-family":"ui-sans-serif,system-ui,sans-serif"}, tg);
      tx.textContent = label;
    }
  });
}

function drawBall(){
  var g = document.getElementById("ballL");
  var b = g.firstChild;
  if (!cur.ball){ if (b) g.removeChild(b); return; }
  var p = at(cur.ball);
  if (!b){
    b = el("g", {"class":"ball", "pointer-events":"none"}, g);
    el("circle", {r:11, fill:"#FFF", stroke:"rgba(10,25,32,.45)", "stroke-width":2}, b);
    el("circle", {r:4, fill:"#0E1C26", opacity:".7"}, b);
  }
  b.setAttribute("transform", "translate(" + (p.x + 30) + "," + (p.y + 22) + ")");
}

function drawZones(){
  var g = document.getElementById("zones");
  g.innerHTML = "";
  if (!cur.zones) return;
  cur.zones.forEach(function(key){
    var p = SPOT[key];
    var tone = (cur.zoneTone && cur.zoneTone[key]) || "fair";
    var picked = (zonePicked === key);
    var col = !zonePicked ? "#B9A6FF"
            : picked ? (tone === "good" ? "#74D6A4" : tone === "poor" ? "#F2795C" : "#B9A6FF")
            : "#7E8E97";
    var z = el("g", {class:"disc", tabindex:"0", role:"button"}, g);
    z.setAttribute("aria-label", "Zone option");
    el("circle", {cx:p.x, cy:p.y, r:52, fill:col, opacity:picked ? ".2" : ".1"}, z);
    el("circle", {cx:p.x, cy:p.y, r:52, fill:"none", stroke:col, "stroke-width":picked ? 4 : 3,
      "stroke-dasharray":picked ? "none" : "9 8", opacity:picked ? "1" : ".7"}, z);
    var q = el("text", {x:p.x, y:p.y + 10, "text-anchor":"middle", fill:col,
      "font-size":"30", "font-weight":"800", "pointer-events":"none",
      "font-family":"ui-sans-serif,system-ui,sans-serif"}, z);
    q.textContent = picked ? (tone === "good" ? "\u2713" : tone === "poor" ? "\u2715" : "?") : "?";
    z.addEventListener("click", function(){ onZone(key); });
    z.addEventListener("keydown", function(e){
      if (e.key === "Enter" || e.key === " "){ e.preventDefault(); onZone(key); }
    });
  });
}

/* ============================================================
   THE CALLOUT — anchored to whatever was tapped
   ============================================================ */
function docked(){ return window.matchMedia("(max-width: 560px)").matches; }

function showPop(anchor, text, tone){
  var t = split1(text);
  document.getElementById("popH").textContent = t.h;
  document.getElementById("popB").textContent = t.b;
  pop.setAttribute("data-tone", tone);
  pop.hidden = false;
  pop.classList.remove("show");

  if (docked()){
    pop.setAttribute("data-nib", "x");
    pop.style.left = ""; pop.style.top = "";
    void pop.offsetWidth; pop.classList.add("show");
    return;
  }

  pop.style.left = "0px"; pop.style.top = "0px";
  var wrap = document.getElementById("fieldwrap").getBoundingClientRect();
  var fr = document.getElementById("field").getBoundingClientRect();
  if (!fr.width){ pop.classList.add("show"); return; }
  var sx = fr.width / 1000, sy = fr.height / 640;
  var pw = pop.offsetWidth / sx, ph = pop.offsetHeight / sy;   // layout size, unscaled

  // everything the callout should stay off, weighted by how much it matters
  var obs = [];
  var qr = document.getElementById("panel").getBoundingClientRect();
  obs.push({x0:(qr.left-fr.left)/sx - 8, y0:(qr.top-fr.top)/sy - 8,
            x1:(qr.right-fr.left)/sx + 8, y1:(qr.bottom-fr.top)/sy + 8, w:10});
  (cur.cast || []).forEach(function(id){
    var p = at(id);
    obs.push({x0:p.x-34, y0:p.y-34, x1:p.x+34, y1:p.y+34, w:5});
    var lab = (cur.tags || {})[id];
    if (lab){
      var hw = (lab.length * 8.2 + 16) / 2 + 4;
      obs.push({x0:p.x-hw, y0:p.y-64, x1:p.x+hw, y1:p.y-28, w:3});
    }
  });
  (cur.zones || []).forEach(function(k){
    var p = SPOT[k];
    obs.push({x0:p.x-56, y0:p.y-56, x1:p.x+56, y1:p.y+56, w:4});
  });

  var g = 46;
  var cands = [
    [anchor.x+g,     anchor.y-ph/2],  [anchor.x-g-pw,  anchor.y-ph/2],
    [anchor.x+g,     anchor.y-ph+20], [anchor.x-g-pw,  anchor.y-ph+20],
    [anchor.x+g,     anchor.y-20],    [anchor.x-g-pw,  anchor.y-20],
    [anchor.x-pw/2,  anchor.y-g-ph],  [anchor.x-pw/2,  anchor.y+g],
    [anchor.x-pw+34, anchor.y-g-ph],  [anchor.x-34,    anchor.y+g],
    [anchor.x-pw+34, anchor.y+g],     [anchor.x-34,    anchor.y-g-ph]
  ];
  var nStruct = cands.length;
  for (var gx = 10; gx <= 990 - pw; gx += 52)
    for (var gy = 10; gy <= 630 - ph; gy += 52) cands.push([gx, gy]);

  var bx = 8, by = 8, bs = Infinity;
  cands.forEach(function(c, i){
    var x = Math.max(8, Math.min(992 - pw, c[0]));
    var y = Math.max(8, Math.min(632 - ph, c[1]));
    var dx = (x + pw/2) - anchor.x, dy = (y + ph/2) - anchor.y;
    var sc = Math.sqrt(dx*dx + dy*dy) / 34;      // stay near the player...
    if (i < nStruct) sc -= 1.6;
    obs.forEach(function(o){                      // ...unless something is in the way
      var ox = Math.min(x + pw, o.x1) - Math.max(x, o.x0);
      var oy = Math.min(y + ph, o.y1) - Math.max(y, o.y0);
      if (ox > 0 && oy > 0) sc += (ox * oy) / 300 * o.w;
    });
    if (sc < bs){ bs = sc; bx = x; by = y; }
  });

  pop.style.left = ((fr.left - wrap.left) + bx * sx) + "px";
  pop.style.top  = ((fr.top  - wrap.top)  + by * sy) + "px";

  // pointer on whichever edge faces the player, hidden if we had to move far
  var nib = pop.querySelector(".nib"), side = "x", off;
  nib.style.top = nib.style.bottom = nib.style.left = nib.style.right = "";
  if (anchor.x < bx - 2)              side = "l";
  else if (anchor.x > bx + pw + 2)    side = "r";
  else if (anchor.y < by - 2)         side = "t";
  else if (anchor.y > by + ph + 2)    side = "b";
  var gapX = Math.max(0, Math.max(bx - anchor.x, anchor.x - (bx + pw)));
  var gapY = Math.max(0, Math.max(by - anchor.y, anchor.y - (by + ph)));
  if (Math.max(gapX, gapY) > 120) side = "x";
  pop.setAttribute("data-nib", side);
  if (side === "l" || side === "r"){
    off = Math.max(12, Math.min(ph - 22, anchor.y - by)) * sy;
    nib.style.top = (off - 5) + "px";
    if (side === "l") nib.style.left = "-6.5px"; else nib.style.right = "-6.5px";
  } else if (side === "t" || side === "b"){
    off = Math.max(12, Math.min(pw - 22, anchor.x - bx)) * sx;
    nib.style.left = (off - 5) + "px";
    if (side === "t") nib.style.top = "-6.5px"; else nib.style.bottom = "-6.5px";
  }

  void pop.offsetWidth;
  pop.classList.add("show");
}

function hidePop(){ pop.classList.remove("show"); pop.hidden = true; }

/* ============================================================
   INTERACTION
   ============================================================ */
function currentAsk(){
  if (cur.action && !acted) return null;
  if (cur.ask) return cur.ask;
  if (cur.asks) return cur.asks[askIdx];
  return null;
}
function merge(a,b){ var o={},k; for(k in (a||{}))o[k]=a[k]; for(k in (b||{}))o[k]=b[k]; return o; }

function missFor(ask, id){
  if (ask.miss && ask.miss[id]) return ask.miss[id];
  if (P[id].t === P[ask.answer].t)
    return "Not this one | Look again \u2014 start from the ball.";
  return P[ask.answer].t === "a"
    ? "Wrong team | That's a blue defender. You're looking for a yellow attacker."
    : "Wrong team | That's a yellow attacker. You're looking for a blue defender.";
}

function qkey(){ return seq[pos_] + ":" + askIdx; }

function onTap(id){
  var ask = currentAsk();
  if (!ask || resolved) return;
  var k = qkey(), fresh = !(k in qscore);   // scored on the first tap ever, and never again
  if (id === ask.answer){
    resolved = true; hitId = id;
    if (fresh){
      qscore[k] = "right";
      right++;
      streak++; if (streak > bestStreak) bestStreak = streak;
      play(streak % 5 === 0 ? "okBig" : "ok");
      if (streak === 3 || streak === 5 || streak === 10) bumpStreak();
    } else {
      play("ok");
    }
    if (ask.tag) cur.tags = merge(cur.tags, ask.tag);
    render();
    showPop(at(id), ask.ok, "ok");
  } else {
    if (fresh){ qscore[k] = "wrong"; streak = 0; }
    tried[id] = true;
    play("miss");
    render();
    showPop(at(id), missFor(ask, id), "miss");
  }
}

function onZone(key){
  if (!cur.zoneResult) return;
  var tone = (cur.zoneTone && cur.zoneTone[key]) || "fair";
  play(tone === "good" ? "ok" : tone === "poor" ? "miss" : "pick");
  zonePicked = key;
  if (cur.zoneOwner){
    var o = {}; o[cur.zoneOwner] = key;
    cur.at   = merge(base.at, o);
    cur.tags = merge(base.tags, (cur.zoneTag && cur.zoneTag[key]) || {});
    cur.cast = base.cast.slice();
    if (cur.cast.indexOf(cur.zoneOwner) < 0){
      entering = [cur.zoneOwner];
      cur.cast = cur.cast.concat([cur.zoneOwner]);
    }
    markGood = tone === "good" ? [cur.zoneOwner] : [];
    markPoor = tone === "poor" ? [cur.zoneOwner] : [];
  }
  render();
  showPop(SPOT[key], cur.zoneResult[key],
          tone === "good" ? "ok" : (tone === "poor" ? "miss" : "talk"));
}

function pickChoice(ci){
  play("pick");
  var c = cur.choices[ci];
  chosen = ci;
  cur.at   = merge(base.at, c.at || {});
  cur.ball = c.ball || base.ball;
  cur.tags = merge(base.tags, c.tags || {});
  markGood = (c.mark && c.mark.good) || [];
  markPoor = (c.mark && c.mark.poor) || [];
  render();
}

function doAction(){
  var a = cur.action;
  if (a.cast){
    entering = a.cast.filter(function(id){ return cur.cast.indexOf(id) < 0; });
    cur.cast = cur.cast.concat(entering);
  }
  if (a.ball) cur.ball = a.ball;
  if (a.at) cur.at = merge(cur.at, a.at);
  if (a.tags) cur.tags = a.tags;
  acted = true; hidePop(); render();
}

function goSeq(k){
  pos_ = Math.max(0, Math.min(seq.length - 1, k));
  cur = clone(STEPS[seq[pos_]]);
  askIdx = 0; resolved = false; acted = false; tried = {}; hitId = null; entering = [];
  markGood = []; markPoor = []; chosen = -1;
  zonePicked = null;
  base = {at:clone(cur.at || {}), ball:cur.ball, tags:clone(cur.tags || {}), cast:clone(cur.cast || [])};
  if (cur.coachOnly) notesOpen = true;     // its content lives in the right pane
  hidePop(); render();
}

function nextAction(){
  var last = pos_ >= seq.length - 1 && !(cur.asks && askIdx < cur.asks.length - 1);
  if (!last && pos_ === seq.length - 2 && !(cur.asks && askIdx < cur.asks.length - 1)){
    // arriving at the final step: a good run earns the referee's whistle
    var total = scoredTotal();
    if (!cheered && total > 0 && right >= Math.ceil(total * 0.7)){
      cheered = true;
      setTimeout(function(){ play("whistle"); }, 450);
    }
  }
  if (cur.asks && askIdx < cur.asks.length - 1){
    askIdx++; resolved = false; tried = {}; hitId = null; hidePop(); render(); return;
  }
  if (pos_ >= seq.length - 1){ loadScenario(scenIdx); return; }
  goSeq(pos_ + 1);
}

/* ============================================================
   RENDER
   ============================================================ */
function render(){
  drawUnits(); drawBall(); drawZones();
  var ask = currentAsk();

  var panel = document.getElementById("panel");
  panel.setAttribute("data-kind", cur.kind);
  panel.classList.toggle("tall", cur.kind === "info");

  var kicker = document.getElementById("kicker");
  if (cur.kind === "tap") kicker.innerHTML = "Scored \u00b7 one right answer";
  else if (cur.kind === "talk") kicker.innerHTML = "<em>Not scored \u00b7 talk about it</em>";
  else kicker.innerHTML = "";

  var qt = cur.q;
  if (cur.asks && acted) qt = cur.asks[askIdx].q;
  else if (cur.action && acted && cur.action.q) qt = cur.action.q;
  document.getElementById("q").textContent = qt;

  // steps written for the coach put their substance in the right pane
  var toNotes = !!cur.coachOnly;
  var textToNotes = toNotes && notesOpen;   // the QR never falls back, the text does
  var body = document.getElementById("body");
  body.innerHTML = textToNotes ? "" : (cur.a || "");
  body.hidden = textToNotes || !cur.a;
  var fy = document.getElementById("foryou");
  fy.hidden = !toNotes;
  document.getElementById("fybody").innerHTML = toNotes ? (cur.a || "") : "";
  document.getElementById("qrN").hidden = !cur.qr;
  var resp = document.getElementById("resp");
  resp.hidden = true; resp.innerHTML = "";

  var pr = document.getElementById("pairs");
  pr.hidden = !cur.pairs;
  if (cur.pairs) pr.innerHTML = cur.pairs.map(function(p){
    return "<i>" + p[0] + "</i> \u2194 <u>" + p[1] + "</u>";
  }).join("<br>");


  var notesEl = document.getElementById("notes");
  notesEl.classList.toggle("min", !notesOpen);
  var nt = document.getElementById("notesToggle");
  nt.textContent = notesOpen ? "\u203a" : "\u2039";
  nt.setAttribute("aria-expanded", String(notesOpen));
  var ntl = notesOpen ? "Hide coach notes \u2014 also hides the coach-only steps" : "Show coach notes";
  nt.setAttribute("aria-label", ntl); nt.title = ntl;

  var ch = document.getElementById("choices");
  ch.innerHTML = "";
  (cur.choices || []).forEach(function(c, ci){
    var b = document.createElement("button");
    b.className = "choice"; b.textContent = c.t;
    b.setAttribute("data-tone", c.tone || "fair");
    b.setAttribute("aria-pressed", String(ci === chosen));
    b.addEventListener("click", function(){ pickChoice(ci); });
    ch.appendChild(b);
  });
  if (chosen > -1 && cur.choices && cur.choices[chosen]){
    var c2 = cur.choices[chosen], t2 = split1(c2.r);
    resp.hidden = false;
    resp.setAttribute("data-tone", c2.tone || "fair");
    resp.innerHTML = t2.h ? ("<b>" + t2.h + "</b> " + t2.b) : t2.b;
    var pb = document.getElementById("pbody");
    pb.scrollTop = pb.scrollHeight;
  }

  // collapsed state — the question shrinks to a line, the controls stay put
  panel.classList.toggle("min", collapsed);
  document.getElementById("pill").textContent = qt;
  var cb = document.getElementById("collapseBtn");
  cb.textContent = collapsed ? "\u25be" : "\u25b4";
  cb.setAttribute("aria-expanded", String(!collapsed));
  var cbl = collapsed ? "Show the instructions" : "Hide the instructions";
  cb.setAttribute("aria-label", cbl); cb.title = cbl;

  var backBtn = document.getElementById("backBtn");
  backBtn.hidden = pos_ === 0;
  backBtn.textContent = collapsed ? "\u2039" : "Back";
  backBtn.setAttribute("aria-label", "Back"); backBtn.title = "Back";

  var actPending = !!(cur.action && !acted);
  var actBtn = document.getElementById("actBtn");
  actBtn.hidden = !actPending;
  if (cur.action){
    actBtn.textContent = collapsed ? "\u25b6" : cur.action.t;
    actBtn.setAttribute("aria-label", cur.action.t); actBtn.title = cur.action.t;
  }

  var waiting = !!(ask && !resolved);
  var label = waiting ? "Tap a player"
            : (cur.asks && askIdx < cur.asks.length - 1) ? "Next question"
            : (pos_ >= seq.length - 1) ? "Start over" : cur.next;
  var nextBtn = document.getElementById("nextBtn");
  nextBtn.hidden = actPending;
  nextBtn.textContent = collapsed ? "\u203a" : label;
  nextBtn.setAttribute("aria-label", label); nextBtn.title = label;
  nextBtn.disabled = waiting;

  document.getElementById("clock").textContent = mmss(cur.time);
  document.getElementById("clockcap").innerHTML =
    "Step " + (pos_ + 1) + " of " + seq.length + "<br>" + TRACKS[trackIdx].name + " runs " + mmss(trackTotal());
  document.getElementById("say").textContent = cur.say;
  var why = document.getElementById("why");
  why.innerHTML = "";
  (cur.why || []).forEach(function(w){ var li = document.createElement("li"); li.innerHTML = w; why.appendChild(li); });

  paintRail(); paintTally(); paintLegend(); paintStreak();
  entering = [];
}

function paintRail(){
  var rail = document.getElementById("rail");
  rail.innerHTML = "";
  seq.forEach(function(n, k){
    var st = STEPS[n];
    if (k > 0 && (st.track === "F") !== (STEPS[seq[k-1]].track === "F")){
      var d = document.createElement("span"); d.className = "railgap"; rail.appendChild(d);
    }
    var b = document.createElement("button");
    b.className = "pip";
    b.setAttribute("data-kind", st.kind);
    b.setAttribute("data-state", k < pos_ ? "done" : (k === pos_ ? "now" : "todo"));
    b.title = (k + 1) + ". " + st.label + " \u00b7 " + mmss(st.time);
    b.setAttribute("aria-label", b.title);
    b.addEventListener("click", function(){ goSeq(k); });
    rail.appendChild(b);
  });
}

var EXPLAIN = {
  penetration:"Get the ball forward, toward goal \u2014 by dribble, pass or shot. The first attacker's job, and the thing every other principle exists to enable or to stop.",
  support:"Give the player on the ball an angle he can actually use: close enough to receive, placed so no defender is standing on the passing line. The second attacker's job.",
  mobility:"Movement that disturbs the defence whether or not you get the ball. A run that drags a marker out of position has already done its work. The third attacker's job.",
  width:"Use the full breadth of the field so defenders have to spread out. Width creates no chances by itself \u2014 it creates the space where chances happen.",
  creativity:"Licence to try the low-percentage thing in the attacking third. The one principle a coach can permit but cannot install.",
  delay:"Slow the attack down. Stay on your feet, angle the carrier away from goal, buy time for help to arrive. The first defender's job.",
  cover:"Stand behind and inside the defender pressuring the ball, so that if he is beaten someone is still there. The second defender's job.",
  balance:"Guard the dangerous space away from the ball. The defender furthest from play sees the runs nobody else can. The third defender's job.",
  compactness:"Shrink the distance between defenders so the attack has to go around you rather than through you. The cost is the far-side player \u2014 that is the trade.",
  control:"Restraint. No lunges, no gambles, no getting pulled out of shape. Attackers are allowed to gamble; defenders are not."
};

var PRIN = [
  ["penetration","Penetration","delay","Delay"],
  ["support","Support","cover","Cover"],
  ["mobility","Mobility","balance","Balance"],
  ["width","Width","compactness","Compactness"],
  ["creativity","Creativity","control","Control"]
];

function showTip(e){
  var it = e.currentTarget;
  var k = it.getAttribute("data-k");
  var tip = document.getElementById("tip");
  document.getElementById("tipH").textContent = it.textContent;
  document.getElementById("tipB").textContent = EXPLAIN[k] || "";
  tip.setAttribute("data-side", it.getAttribute("data-side"));
  tip.hidden = false;
  var wr = document.getElementById("fieldwrap").getBoundingClientRect();
  var ir = it.getBoundingClientRect();
  var tw = tip.offsetWidth, th = tip.offsetHeight;
  var x = (ir.left - wr.left) + ir.width / 2 - tw / 2;
  x = Math.max(4, Math.min(wr.width - tw - 4, x));
  var y = (ir.top - wr.top) - th - 8;
  if (y < 4) y = (ir.bottom - wr.top) + 8;
  tip.style.left = x + "px"; tip.style.top = y + "px";
  void tip.offsetWidth; tip.classList.add("show");
}
function hideTip(){
  var tip = document.getElementById("tip");
  tip.classList.remove("show"); tip.hidden = true;
}

function buildLegend(){
  var L = document.getElementById("legend");
  L.innerHTML = "";
  [["Attacking","a",1],["Defending","d",3]].forEach(function(row){
    var c = document.createElement("span");
    c.className = "lcap"; c.textContent = row[0]; L.appendChild(c);
    PRIN.forEach(function(p){
      var e = document.createElement("span");
      e.className = "li";
      e.setAttribute("data-side", row[1]);
      e.setAttribute("data-k", p[row[2] - 1]);
      e.setAttribute("tabindex", "0");
      e.textContent = p[row[2]];
      e.addEventListener("mouseenter", showTip);
      e.addEventListener("mouseleave", hideTip);
      e.addEventListener("focus", showTip);
      e.addEventListener("blur", hideTip);
      e.addEventListener("click", showTip);
      L.appendChild(e);
    });
  });
}

function paintLegend(){
  var inTrack = {}, soFar = {}, live = {};
  seq.forEach(function(n, k){
    (STEPS[n].hi || []).forEach(function(key){
      inTrack[key] = 1;
      if (k < pos_) soFar[key] = 1;
    });
  });
  ((cur && cur.hi) || []).forEach(function(key){ live[key] = 1; });
  [].forEach.call(document.querySelectorAll(".li"), function(e){
    var k = e.getAttribute("data-k");
    var st = live[k] ? "live" : (soFar[k] ? "done" : (inTrack[k] ? "todo" : "off"));
    e.setAttribute("data-state", st);
    e.title = (st === "off") ? "Not covered in this track \u2014 switch to Full session or Practice"
                             : PRIN.reduce(function(a,p){
                                 return p[0] === k ? p[1] + " \u2194 " + p[3]
                                      : p[2] === k ? p[3] + " \u2194 " + p[1] : a; }, "");
  });
}

function scoredTotal(){
  var n = 0;
  seq.forEach(function(k){
    var st = STEPS[k];
    if (st.asks) n += st.asks.length; else if (st.ask) n += 1;
  });
  return n;
}
function paintStreak(){
  var el2 = document.getElementById("streak");
  el2.hidden = streak < 2;
  if (streak < 2) return;
  document.getElementById("streakN").textContent = streak;
  el2.className = "streak" + (streak >= 10 ? " grow3" : streak >= 5 ? " grow2" : "");
  el2.title = "Streak: " + streak + " right in a row (best " + bestStreak + ")";
}
function bumpStreak(){
  var el2 = document.getElementById("streak");
  el2.classList.remove("pop"); void el2.offsetWidth; el2.classList.add("pop");
}

function paintTally(){
  document.getElementById("tally").innerHTML =
    "SCORE <b>" + right + "</b> of " + scoredTotal();
}

/* ============================================================
   CHROME
   ============================================================ */
document.getElementById("sndBtn").addEventListener("click", function(){
  sndOn = !sndOn;
  this.setAttribute("aria-pressed", String(sndOn));
  this.textContent = sndOn ? "\uD83D\uDD0A" : "\uD83D\uDD07";
  var lb = sndOn ? "Sound is on" : "Sound is off";
  this.setAttribute("aria-label", lb); this.title = lb;
  if (sndOn){ ac(); play("ok"); }
});
document.getElementById("popX").addEventListener("click", hidePop);
document.getElementById("notesToggle").addEventListener("click", function(){
  notesOpen = !notesOpen;
  var here = seq[pos_];
  buildSeq();
  var k = seq.indexOf(here);
  if (k > -1){ pos_ = k; render(); }
  else goSeq(Math.min(pos_, seq.length - 1));
});
document.getElementById("collapseBtn").addEventListener("click", function(){ collapsed = !collapsed; render(); });
document.getElementById("backBtn").addEventListener("click", function(){ goSeq(pos_ - 1); });
document.getElementById("actBtn").addEventListener("click", doAction);
document.getElementById("nextBtn").addEventListener("click", nextAction);

document.addEventListener("keydown", function(e){
  if (e.target.tagName === "BUTTON" || (e.target.closest && e.target.closest(".disc"))) return;
  if (e.key === "ArrowRight" && !(currentAsk() && !resolved)) nextAction();
  if (e.key === "ArrowLeft" && pos_ > 0) goSeq(pos_ - 1);
});

function isNarrow(){ return window.matchMedia("(max-width: 900px)").matches; }
if (isNarrow()) notesOpen = false;

buildLegend();
var sel = document.getElementById("scenSel");
function opt(parent, val, label){
  var o = document.createElement("option");
  o.value = val; o.textContent = label; parent.appendChild(o);
}
SCEN.forEach(function(sc, n){
  if (sc.tracks){
    var g = document.createElement("optgroup");
    g.label = sc.name;
    TRACKS.forEach(function(t, ti){
      var secs = 0;
      sc.STEPS.forEach(function(st){ if (st.track.indexOf(t.key) > -1) secs += st.time; });
      opt(g, n + "|" + ti, t.name + "  \u00b7  " + mmss(secs));
    });
    sel.appendChild(g);
  }
});
var g2 = document.createElement("optgroup");
g2.label = "Scenarios";
SCEN.forEach(function(sc, n){
  if (!sc.tracks){
    var secs = 0; sc.STEPS.forEach(function(st){ secs += st.time; });
    opt(g2, n + "|0", sc.name + "  \u00b7  " + mmss(secs));
  }
});
sel.appendChild(g2);

sel.addEventListener("change", function(){
  var v = this.value.split("|");
  trackIdx = parseInt(v[1], 10) || 0;
  loadScenario(parseInt(v[0], 10));
});
sel.value = "0|0";
loadScenario(0);
</script>
